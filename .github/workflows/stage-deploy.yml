name: Stage Deployment (development)

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Publish beta package to NPM under "beta" tag? (true/false)'
        required: false
        default: 'false'

jobs:
  stage:
    name: Build & Verify Stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality Checks
        run: |
          npm run format:check
          npm run lint

      - name: Compile TypeScript library
        run: npm run build

      - name: Publish Beta to NPM (Optional)
        if: ${{ github.event.inputs.publish_beta == 'true' }}
        run: |
          npm version prerelease --preid=beta --no-git-tag-version
          npm publish --access public --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
